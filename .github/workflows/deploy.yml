name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Let an active production deployment finish before the next one starts.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          # The action reports the correct project-site subpath, avoiding
          # domain-root asset URLs when the repository name changes.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Validate deployable artifact
        run: npm run check:deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # 30 minutes in milliseconds
      - name: Verify deployed entry point
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          # A competing "pages build and deployment" run can overwrite this
          # artifact seconds later, so settle first and then re-check. Verifying
          # immediately after upload reports success on a site that is already
          # about to be replaced.
          sleep 45

          for attempt in {1..8}; do
            if html="$(curl --fail --silent --show-error "${SITE_URL}?deployment=${GITHUB_SHA}&attempt=${attempt}")"; then
              # Source files can only be reachable when Pages is publishing the
              # repository root from a branch instead of this artifact.
              leak="$(curl --silent --output /dev/null --write-out '%{http_code}' "${SITE_URL}package.json?attempt=${attempt}")"

              if grep -q '/assets/' <<< "$html" && ! grep -q '/src/main.tsx' <<< "$html" && [ "$leak" != "200" ]; then
                echo "Production entry point references the compiled bundle."
                exit 0
              fi

              if [ "$leak" = "200" ]; then
                echo "Attempt ${attempt}: repository source is reachable — a branch build is overwriting this deployment."
              fi
            fi
            sleep 15
          done

          echo "::error::GitHub Pages is serving the repository root, not this artifact. A 'pages build and deployment' run is competing with this workflow. In Settings > Pages > Build and deployment, set Source to 'GitHub Actions' (not 'Deploy from a branch'), then re-run this workflow."
          exit 1
