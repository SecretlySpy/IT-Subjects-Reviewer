<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">IT Subjects Reviewer animated banner</title>
  <desc id="desc">A modern study dashboard banner with animated network lines and reviewer cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10211e"/>
      <stop offset="52%" stop-color="#17344a"/>
      <stop offset="100%" stop-color="#3a294d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#16805f"/>
      <stop offset="48%" stop-color="#0e9a9a"/>
      <stop offset="100%" stop-color="#326bdc"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#06120f" flood-opacity="0.32"/>
    </filter>
    <style>
      .grid { stroke: rgba(255,255,255,.08); stroke-width: 1; }
      .card { fill: rgba(255,255,255,.10); stroke: rgba(255,255,255,.22); }
      .line { fill: none; stroke: url(#accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 18 16; animation: dash 3s linear infinite; }
      .node { fill: #f7fffb; stroke: #78d5c9; stroke-width: 4; animation: pulse 2.4s ease-in-out infinite; }
      .node:nth-of-type(2) { animation-delay: .25s; }
      .node:nth-of-type(3) { animation-delay: .5s; }
      .float { animation: float 5s ease-in-out infinite; }
      .float.two { animation-delay: .45s; }
      .float.three { animation-delay: .9s; }
      .text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f4fbf8; }
      .muted { fill: #b7c8c2; }
      @keyframes dash { to { stroke-dashoffset: -68; } }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; transform-origin: center; }
        50% { transform: scale(1.08); opacity: .82; transform-origin: center; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <rect width="960" height="300" rx="24" fill="url(#bg)"/>
  <g opacity=".42">
    <path class="grid" d="M0 50h960M0 100h960M0 150h960M0 200h960M0 250h960"/>
    <path class="grid" d="M80 0v300M160 0v300M240 0v300M320 0v300M400 0v300M480 0v300M560 0v300M640 0v300M720 0v300M800 0v300M880 0v300"/>
  </g>

  <g transform="translate(70 70)">
    <rect x="0" y="0" width="470" height="160" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
    <text class="text" x="30" y="52" font-size="40" font-weight="800">IT Subjects Reviewer</text>
    <text class="muted text" x="30" y="88" font-size="18">Interactive study dashboards for IT courses</text>
    <rect x="30" y="115" width="128" height="28" rx="8" fill="#16805f"/>
    <text class="text" x="46" y="135" font-size="13" font-weight="700">Static HTML</text>
    <rect x="170" y="115" width="126" height="28" rx="8" fill="#326bdc"/>
    <text class="text" x="190" y="135" font-size="13" font-weight="700">Responsive</text>
    <rect x="308" y="115" width="122" height="28" rx="8" fill="#7556b8"/>
    <text class="text" x="330" y="135" font-size="13" font-weight="700">No Build</text>
  </g>

  <path class="line" d="M500 145 C575 84 636 86 700 116 S824 190 900 126" opacity=".72"/>
  <circle class="node" cx="500" cy="145" r="11"/>
  <circle class="node" cx="700" cy="116" r="11"/>
  <circle class="node" cx="900" cy="126" r="11"/>

  <g transform="translate(575 58)" filter="url(#softShadow)">
    <g class="float">
      <rect class="card" x="0" y="0" width="255" height="58" rx="14"/>
      <circle cx="30" cy="29" r="13" fill="#16805f"/>
      <text class="text" x="58" y="25" font-size="15" font-weight="800">Topic Cards</text>
      <text class="muted text" x="58" y="44" font-size="12">Jump through chapters</text>
    </g>
    <g class="float two">
      <rect class="card" x="40" y="82" width="255" height="58" rx="14"/>
      <circle cx="70" cy="111" r="13" fill="#0e9a9a"/>
      <text class="text" x="98" y="107" font-size="15" font-weight="800">Flashcards</text>
      <text class="muted text" x="98" y="126" font-size="12">Flip, review, repeat</text>
    </g>
    <g class="float three">
      <rect class="card" x="0" y="164" width="255" height="58" rx="14"/>
      <circle cx="30" cy="193" r="13" fill="#326bdc"/>
      <text class="text" x="58" y="189" font-size="15" font-weight="800">Scored Quizzes</text>
      <text class="muted text" x="58" y="208" font-size="12">Practice with feedback</text>
    </g>
  </g>
</svg>
